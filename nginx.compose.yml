services:
  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - '8001:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      main:
        condition: service_healthy
    # A more robust script using 'ping'
    command: >
      sh -c "until getent hosts main > /dev/null 2>&1; do 
        echo 'Waiting for main service...'; 
        sleep 2; 
      done; 
      echo 'SUCCESS: main service found at $(getent hosts main | awk \"{print \$1}\"). Starting Nginx now...';
      nginx -g 'daemon off;'"
    healthcheck:
      test: ['CMD-SHELL', "curl -sI http://localhost | grep -q 'HTTP/1.1' || exit 1"]
      start_period: 30s
      start_interval: 0.5s
      interval: 20s
      timeout: 5s
      retries: 5
